# Fluffy — Continuous Integration
#
# Runs on every pull request. Blocks the merge if any required check fails.
# Kept fast (~3-4 min) by running the jobs in parallel.
#
# If a check fails, click into it — the failing step shows the error inline.
#
# NOTE ON LAYOUT: this is a pnpm WORKSPACE with a single root lockfile. Every
# job installs once at the root with --frozen-lockfile, then targets a package
# with --filter. Do not add per-package `pnpm install` steps — there are no
# per-package lockfiles, and --frozen-lockfile would fail.
#
# DEPLOYMENT-AGNOSTIC ON PURPOSE: nothing here knows or cares where the app is
# hosted. Lint, typecheck, test and build are true of the code regardless of
# what serves it, so changing hosting never means rewriting CI.

name: CI

on:
  # NO `branches:` filter on pull_request, deliberately.
  #
  # `branches` filters by the TARGET branch. Restricting it to [main, dev] means
  # a STACKED pull request — feat/b targeting feat/a rather than dev — never
  # runs CI at all. It shows only third-party checks and reads as "mostly green"
  # while being completely unverified.
  pull_request:

  # Pushes stay filtered. These runs keep the branch-protection status current
  # on the long-lived branches; running on every feature-branch push would just
  # duplicate the PR run.
  push:
    branches: [main, dev]

# Cancel older runs on the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # ─── Frontend ────────────────────────────────────────────────────

  frontend-lint:
    name: Frontend · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./frontend lint

  frontend-typecheck:
    name: Frontend · Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./frontend typecheck

  frontend-test:
    name: Frontend · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./frontend test

  frontend-build:
    name: Frontend · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        # Dummy build-time env. The real values live in the host's dashboard;
        # these exist only so the build can resolve `process.env` references.
        #
        # The API URL is deliberately unreachable: a build that silently depends
        # on a live API at build time would pass here and fail on deploy. If the
        # build needs data, it must handle the fetch failing.
        env:
          # Origin only. lib/config.ts appends the /api/v1 prefix, so setting it
          # here too would produce /api/v1/api/v1.
          NEXT_PUBLIC_API_URL: http://localhost:9999
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
        run: pnpm --filter ./frontend build

  # ─── Backend ─────────────────────────────────────────────────────

  backend-lint:
    name: Backend · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./backend lint

  backend-test:
    name: Backend · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        # USE_FILE_DATA routes every repository call to the in-memory store, so
        # the suite needs no MySQL service container. That is the whole point of
        # the repo seam — see backend/repo.js.
        env:
          USE_FILE_DATA: 'true'
          JWT_SECRET: ci-only-secret-never-used-in-production
          GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
          LOG_CONSOLE: 'false'
        run: pnpm --filter ./backend test

  backend-migrations:
    name: Backend · Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The one job that needs a real database. Everything else runs against the
    # in-memory store, but migrations are SQL — the only way to know they are
    # valid is to execute them against the engine they target.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: fluffy_ci
        ports:
          - 3306:3306
        # Without a health check the job races the container: MySQL accepts TCP
        # connections seconds before it will accept queries.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations to a fresh database
        env:
          # USE_FILE_DATA deliberately OFF — this job is the one that talks SQL.
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: fluffy_ci
          JWT_SECRET: ci-only-secret-never-used-in-production
          GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
          LOG_CONSOLE: 'false'
        run: pnpm --filter ./backend migrate

      - name: Re-run to prove migrations are idempotent
        # A second run must apply nothing. This catches a migration that was
        # recorded but whose statements are not safely repeatable, and proves
        # the schema_migrations bookkeeping actually works.
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: fluffy_ci
          JWT_SECRET: ci-only-secret-never-used-in-production
          GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
          LOG_CONSOLE: 'false'
        run: |
          output=$(pnpm --filter ./backend migrate)
          echo "$output"
          if ! echo "$output" | grep -q "up to date"; then
            echo "::error::Second migration run applied something — migrations are not idempotent"
            exit 1
          fi

      - name: Seed the catalog
        # Proves seed.js still matches the schema the migrations produce.
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: fluffy_ci
          JWT_SECRET: ci-only-secret-never-used-in-production
          GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
          LOG_CONSOLE: 'false'
        run: pnpm --filter ./backend seed

  # ─── Aggregate gate ──────────────────────────────────────────────
  #
  # This is the ONE check to mark as required in branch protection. Adding a
  # job above automatically tightens the gate; the protection rule never needs
  # editing, and it can't drift out of sync with the job list.

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
      - backend-lint
      - backend-test
      - backend-migrations
    # `always()` so this still runs when a dependency failed — otherwise it
    # would be skipped, and a skipped required check blocks the PR forever.
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
