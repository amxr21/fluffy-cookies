# Fluffy — Continuous Integration
#
# Runs on every pull request. Blocks the merge if any required check fails.
# Kept fast (~3-4 min) by running the jobs in parallel.
#
# If a check fails, click into it — the failing step shows the error inline.
#
# NOTE ON LAYOUT: this is a pnpm WORKSPACE with a single root lockfile. Every
# job installs once at the root with --frozen-lockfile, then targets a package
# with --filter. Do not add per-package `pnpm install` steps — there are no
# per-package lockfiles, and --frozen-lockfile would fail.
#
# DEPLOYMENT-AGNOSTIC ON PURPOSE: nothing here knows or cares where the app is
# hosted. Lint, typecheck, test and build are true of the code regardless of
# what serves it, so changing hosting never means rewriting CI.

name: CI

on:
  # NO `branches:` filter on pull_request, deliberately.
  #
  # `branches` filters by the TARGET branch. Restricting it to [main, dev] means
  # a STACKED pull request — feat/b targeting feat/a rather than dev — never
  # runs CI at all. It shows only third-party checks and reads as "mostly green"
  # while being completely unverified.
  pull_request:

  # Pushes stay filtered. These runs keep the branch-protection status current
  # on the long-lived branches; running on every feature-branch push would just
  # duplicate the PR run.
  push:
    branches: [main, dev]

# Cancel older runs on the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # ─── Frontend ────────────────────────────────────────────────────

  frontend-lint:
    name: Frontend · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./frontend lint

  frontend-typecheck:
    name: Frontend · Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./frontend typecheck

  frontend-test:
    name: Frontend · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./frontend test

  frontend-build:
    name: Frontend · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        # Dummy build-time env. The real values live in the host's dashboard;
        # these exist only so the build can resolve `process.env` references.
        env:
          # No API URL: the browser calls this app's own /api/storefront bridge,
          # which reaches the dashboard server-side. API_ORIGIN and the key are
          # read at request time, so the build needs neither.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
        run: pnpm --filter ./frontend build

  frontend-budget:
    name: Frontend · Bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
        run: pnpm --filter ./frontend build

      - name: Check the shared JS budget
        # A JS budget is only a budget if something fails when it is exceeded.
        # This checks the shared chunks every route pays for, which is the
        # number that actually governs LCP on a mid-tier phone over 4G.
        #
        # Raising the limit is a decision to make on a pull request, with the
        # reason in the diff — not something that drifts up unnoticed.
        run: node frontend/scripts/check-bundle-budget.mjs

  frontend-e2e:
    name: Frontend · E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The production build, driven by a real browser against
    # a mock dashboard (frontend/e2e/mock-dashboard.mjs). Catches what unit
    # tests cannot: a route that crashes on render, a bridge that drops the
    # integration key, a menu that renders nothing.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter ./frontend exec playwright install --with-deps chromium
      - name: Build
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
        run: pnpm --filter ./frontend build
      - name: Run the smoke suite
        run: pnpm --filter ./frontend test:e2e
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # ─── Aggregate gate ──────────────────────────────────────────────
  #
  # This is the ONE check to mark as required in branch protection. Adding a
  # job above automatically tightens the gate; the protection rule never needs
  # editing, and it can't drift out of sync with the job list.

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
      - frontend-budget
      - frontend-e2e
    # `always()` so this still runs when a dependency failed — otherwise it
    # would be skipped, and a skipped required check blocks the PR forever.
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
